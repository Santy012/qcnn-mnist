[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qcnn-mnist"
version = "0.1.0"
description = "Estudio de una red convolucional cuántica híbrida (QCNN) sobre MNIST frente a controles clásicos."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
