[build-system]
requires = ["setuptools>=77"]  # licencia como expresión SPDX
build-backend = "setuptools.build_meta"

[project]
name = "qcnn-mnist"
version = "0.1.0"
description = "Estudio de una red convolucional cuántica híbrida (QCNN) sobre MNIST frente a controles clásicos."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santiago Castellanos" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not notebooks'"
markers = ["notebooks: ejecuta los notebooks completos (lento; correr con -m notebooks)"]
